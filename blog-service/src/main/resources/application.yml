server:
  port: 8082

spring:
  application:
    name: blog-service

  datasource:
    url: jdbc:postgresql://localhost:5432/microservice_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Base URL of the user-service for inter-service calls
user-service:
  base-url: http://localhost:8081
